name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  php-lint:
    name: PHP syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none

      - name: Lint all PHP files
        run: |
          set -e
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './.worktrees/*' \
            -print0 | xargs -0 -n1 php -l

  php-tests:
    name: PHP tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none

      # The suite is standalone: each file stubs what it needs and exits non-zero
      # on the first failed assertion, so plain `php <file>` is the whole runner.
      - name: Run standalone tests
        run: |
          set -e
          shopt -s nullglob
          tests=(tests/*.php)
          # Fail loudly on an empty glob — a moved or renamed tests/ directory
          # must not turn this job into a silent pass.
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No test files found under tests/ - refusing to pass vacuously."
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "::group::$t"
            php "$t"
            echo "::endgroup::"
          done
          echo "${#tests[@]} test file(s) passed."

  js-lint:
    name: JS syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint all JS files
        run: |
          set -e
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
